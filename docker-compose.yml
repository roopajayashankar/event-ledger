# Event Ledger — local orchestration.
# Two Spring Boot services plus the observability backends: Jaeger (traces over
# OTLP) and Prometheus (scrapes /actuator/prometheus on both services).

services:
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    image: event-ledger/account-service:dev
    ports:
      - "8081:8081"
    environment:
      # Export spans to Jaeger's OTLP/HTTP receiver.
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger:
        condition: service_started
    healthcheck:
      # Custom /health actively checks H2 connectivity (curl is in the image).
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  event-gateway:
    build:
      context: .
      dockerfile: event-gateway/Dockerfile
    image: event-ledger/event-gateway:dev
    ports:
      - "8080:8080"
    environment:
      # Reach Account Service by its compose service name, not localhost.
      ACCOUNT_SERVICE_URL: http://account-service:8081
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      account-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  jaeger:
    # all-in-one with the OTLP receiver enabled; UI on :16686.
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - event-gateway
      - account-service
