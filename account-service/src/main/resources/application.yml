spring:
  application:
    name: account-service
  datasource:
    # H2 in-memory, owned solely by this service — never shared (CLAUDE.md).
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mvc:
    problemdetails:
      # Emit RFC 7807 ProblemDetail bodies for framework-raised errors too
      # (unknown enum value, malformed JSON), not just our handled exceptions.
      enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Custom /health is separate; these are the actuator surfaces we expose.
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # Sample every request for the demo so traces are always visible in Jaeger.
      probability: 1.0
  otlp:
    tracing:
      # Export spans to Jaeger over OTLP/HTTP. Override via env in docker-compose.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # Spring Boot 3.4+ built-in structured logging: JSON, one object per line.
  # MDC traceId/spanId (populated by Micrometer Tracing) are included automatically.
  structured:
    format:
      console: logstash
    json:
      add:
        # Static field so logs are filterable by service.
        service: account-service
