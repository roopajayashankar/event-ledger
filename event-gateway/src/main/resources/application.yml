spring:
  application:
    name: event-gateway
  datasource:
    # H2 in-memory, owned solely by this service — never shared (CLAUDE.md).
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mvc:
    problemdetails:
      # Emit RFC 7807 ProblemDetail bodies for framework-raised errors too
      # (unknown enum value, malformed JSON, missing params), not just ours.
      enabled: true

server:
  port: 8080

account-service:
  # Where to reach the internal Account Service. Override via the
  # ACCOUNT_SERVICE_URL env var (docker-compose) or this property (tests).
  base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  # Bound latency so a slow Account can't tie up Gateway request threads.
  connect-timeout: 1s
  read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        # Custom /health is separate; these are the actuator surfaces we expose.
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # Sample every request for the demo so traces are always visible in Jaeger.
      probability: 1.0
  otlp:
    tracing:
      # Export spans to Jaeger over OTLP/HTTP. Override via env in docker-compose.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # Spring Boot 3.4+ built-in structured logging: JSON, one object per line.
  # MDC traceId/spanId (populated by Micrometer Tracing) are included automatically.
  structured:
    format:
      console: logstash
    json:
      add:
        # Static field so logs are filterable by service.
        service: event-gateway

resilience4j:
  # Applied to RestClientAccountClient.apply/getBalance via @CircuitBreaker +
  # @Retry (instance name "accountService"). See CLAUDE.md "Resiliency decision".
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50           # open at ~50% failures
        wait-duration-in-open-state: 5s      # fast-fail while open, then probe
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          # Only genuine unavailability trips the breaker. 4xx (rejected) does
          # not — Account is up, it just declined the request.
          - com.eventledger.gateway.service.AccountUnavailableException
  retry:
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true         # jitter -> avoids retry storms
        randomized-wait-factor: 0.5
        retry-exceptions:
          # Retry only transient unavailability (IO, read timeout, 5xx).
          - com.eventledger.gateway.service.AccountUnavailableException
        ignore-exceptions:
          # Never retry a 4xx (won't fix itself) or an open breaker (fast-fail).
          - com.eventledger.gateway.service.AccountRejectedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
