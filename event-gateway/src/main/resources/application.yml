spring:
  application:
    name: event-gateway
  datasource:
    # H2 in-memory, owned solely by this service — never shared (CLAUDE.md).
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mvc:
    problemdetails:
      # Emit RFC 7807 ProblemDetail bodies for framework-raised errors too
      # (unknown enum value, malformed JSON, missing params), not just ours.
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Custom /health is separate; these are the actuator surfaces we expose.
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

logging:
  # Spring Boot 3.4+ built-in structured logging: JSON, one object per line.
  # traceId/spanId are added from MDC once Micrometer Tracing is wired (later).
  structured:
    format:
      console: logstash
